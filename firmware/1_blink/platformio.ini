; 1_Blink -- simplest demo, just toggles the onboard LED (GPIO12).
; Same physical board as the other three sketches (AI-Thinker ESP32-CAM),
; so pinned to the same platform version for consistency, even though this
; sketch is far too simple to be sensitive to it.

[env:esp32cam]
platform = espressif32@6.5.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; VideoCar firmware -- PlatformIO project
; Board: AI-Thinker ESP32-CAM (matches the GPIO pin map hardcoded in 4_VideoCar.ino)
;
; If your specific board isn't recognized as "esp32cam", run `pio boards espressif32`
; to list alternatives (e.g. some clones work better under esp-wrover-kit).

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

; The camera + WiFi + web server binary is too big for the default partition
; table -- this is the same "Huge APP (3MB No OTA/1MB SPIFFS)" scheme people
; select in the Arduino IDE Tools menu for ESP32-CAM sketches.
board_build.partitions = huge_app.csv

monitor_speed = 115200

; Most AI-Thinker ESP32-CAM boards are flashed through a bare FTDI adapter with
; no auto-reset circuit, so a slower, more reliable upload speed is safer than
; the 921600 default. Bump it up if your programmer supports it fine.
upload_speed = 460800

build_flags =
    -DCORE_DEBUG_LEVEL=1

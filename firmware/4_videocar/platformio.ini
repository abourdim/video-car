; VideoCar firmware -- PlatformIO project
; Board: AI-Thinker ESP32-CAM (matches the GPIO pin map hardcoded in 4_VideoCar.ino)
;
; If your specific board isn't recognized as "esp32cam", run `pio boards espressif32`
; to list alternatives (e.g. some clones work better under esp-wrover-kit).

[env:esp32cam]
; Pinned rather than left as "espressif32" (latest). Unpinned, PlatformIO grabs
; whatever the newest platform release is, which can bundle a materially
; different arduino-esp32 core / esp32-camera driver than whatever Arduino
; IDE's Boards Manager had installed when this sketch last worked -- camera
; sensor-probe behavior has changed across versions. 6.5.0 (arduino-esp32
; 2.0.14) is the long-standing stable baseline most ESP32-CAM camera-server
; sketches, including this one, were originally written against.
platform = espressif32@6.5.0
board = esp32cam
framework = arduino

; huge_app.csv (the "Huge APP (3MB No OTA/1MB SPIFFS)" Arduino IDE scheme)
; has no OTA partitions at all, so OTA firmware updates need min_spiffs.csv
; instead: two ~1.9MB app slots (app0/app1) plus a small spiffs. The firmware
; is currently ~1MB, comfortably under 1.9MB -- but this is a harder ceiling
; on future growth than the 3MB huge_app.csv gave. Arduino IDE users need to
; pick "Minimal SPIFFS (1.9MB APP with OTA)" from Tools > Partition Scheme to
; match -- see README.html's Build systems / OTA sections.
board_build.partitions = min_spiffs.csv

; tzapu/WiFiManager backs the web-triggered "WiFi setup" captive portal (see
; enterWifiSetupPortal() in app_server.h). Same version as the other WDIY
; projects that use it, for consistency.
lib_deps =
    tzapu/WiFiManager @ ^2.0.17

monitor_speed = 115200

; Most AI-Thinker ESP32-CAM boards are flashed through a bare FTDI adapter with
; no auto-reset circuit, so a slower, more reliable upload speed is safer than
; the 921600 default. Bump it up if your programmer supports it fine.
upload_speed = 460800

; Arduino IDE's Tools > PSRAM: Enabled menu option sets these two flags behind
; the scenes. PlatformIO's generic esp32cam board definition does NOT set them
; for you, even though this board does have PSRAM -- without BOARD_HAS_PSRAM,
; psramFound() can behave differently than it did under Arduino IDE, and the
; cache-issue fix avoids a known silicon errata when camera + PSRAM are both
; active. This is the single most common "worked in Arduino IDE, broke in
; PlatformIO" gotcha for ESP32-CAM projects specifically.
; Stamps the short git revision into the binary as GIT_REV, so a running car can
; report exactly which commit it came from (shown in the control page footer, in
; /status, and on serial at boot). Fails soft: no git, no .git directory, or a
; shallow checkout just leaves the firmware's own "nogit" default in place.
; Arduino IDE has no equivalent hook, so builds from there always report "nogit".
extra_scripts = pre:git_rev.py

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Network firmware push over ArduinoOTA (works whether the car is on its own
; AP or joined to a router -- see ota_flash.sh). `pio run -e esp32cam-ota -t
; upload --upload-port <car-ip>` instead of a USB/FTDI connection.
[env:esp32cam-ota]
extends = env:esp32cam
upload_protocol = espota
upload_flags =

; 3_motor -- drives the motor controller over I2C (SetMotor.h) through a fixed
; forward/back/left/right/stop sequence, no camera/WiFi involved.
; Same board/pinning rationale as 1_blink -- see its platformio.ini.
;
; NOTE: this sketch runs the drive sequence unconditionally on boot/reset --
; make sure the car has room to move before flashing/resetting it.

[env:esp32cam]
platform = espressif32@6.5.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
